<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="about-dark-glow" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0C0D12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream-dark-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="stream-dark-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#about-dark-glow)" />

  <!-- Prominent Flowing Data Stream Waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M-100 180 C 450 60, 750 480, 1150 360 S 1750 140, 2020 280" stroke="url(#stream-dark-1)" stroke-width="3" />
    <path d="M-100 340 C 400 220, 800 640, 1200 520 S 1700 280, 2020 440" stroke="url(#stream-dark-2)" stroke-width="2.6" stroke-dasharray="12,8" opacity="0.85"/>
    <path d="M-100 520 C 500 380, 850 780, 1250 660 S 1650 420, 2020 580" stroke="url(#stream-dark-1)" stroke-width="3.2" />
    <path d="M-100 700 C 350 560, 900 940, 1300 820 S 1800 580, 2020 760" stroke="url(#stream-dark-2)" stroke-width="2.8" />
    <path d="M-100 860 C 550 720, 950 1100, 1350 980 S 1850 740, 2020 920" stroke="url(#stream-dark-1)" stroke-width="2.2" stroke-dasharray="16,10" opacity="0.7"/>
  </g>

  <!-- Large Intelligent Agent Clusters -->
  <g stroke="#6366F1" stroke-width="1.6" fill="none" opacity="0.6">
    <!-- Left Cluster -->
    <polygon points="380,360 520,280 600,420 460,500" stroke="#38BDF8" />
    <line x1="380" y1="360" x2="600" y2="420" stroke="#818CF8" />
    <line x1="520" y1="280" x2="460" y2="500" stroke="#818CF8" />

    <!-- Right Cluster -->
    <polygon points="1320,320 1480,240 1580,380 1440,480" stroke="#A855F7" />
    <line x1="1320" y1="320" x2="1580" y2="380" stroke="#818CF8" />
    <line x1="1480" y1="240" x2="1440" y2="480" stroke="#818CF8" />

    <!-- Cross Cluster Bridge -->
    <path d="M 600 420 Q 960 340, 1320 320" stroke="#38BDF8" stroke-width="2.2" stroke-dasharray="6,8" opacity="0.85"/>
    <path d="M 460 500 Q 940 640, 1440 480" stroke="#818CF8" stroke-width="2" stroke-dasharray="6,8" opacity="0.8"/>
  </g>

  <!-- High-Visibility Core Particle Hubs -->
  <g>
    <!-- Left Nodes -->
    <circle cx="380" cy="360" r="10" fill="#38BDF8" opacity="0.95" />
    <circle cx="520" cy="280" r="12" fill="#818CF8" opacity="0.95" />
    <circle cx="600" cy="420" r="14" fill="#6366F1" opacity="0.95" />
    <circle cx="460" cy="500" r="10" fill="#C7D2FE" opacity="0.9" />
    <circle cx="490" cy="390" r="7" fill="#FFFFFF" />

    <!-- Right Nodes -->
    <circle cx="1320" cy="320" r="12" fill="#6366F1" opacity="0.95" />
    <circle cx="1480" cy="240" r="10" fill="#38BDF8" opacity="0.95" />
    <circle cx="1580" cy="380" r="14" fill="#A855F7" opacity="0.95" />
    <circle cx="1440" cy="480" r="11" fill="#C7D2FE" opacity="0.9" />
    <circle cx="1455" cy="355" r="7" fill="#FFFFFF" />

    <!-- Radiant Stream Particles -->
    <circle cx="260" cy="210" r="6" fill="#38BDF8" opacity="0.85"/>
    <circle cx="780" cy="360" r="7" fill="#38BDF8" opacity="0.9"/>
    <circle cx="960" cy="480" r="9" fill="#818CF8" opacity="0.9"/>
    <circle cx="1140" cy="390" r="8" fill="#38BDF8" opacity="0.9"/>
    <circle cx="1720" cy="250" r="7" fill="#A855F7" opacity="0.85"/>
    <circle cx="1820" cy="430" r="7" fill="#38BDF8" opacity="0.85"/>
  </g>
</svg>
